name: Set up Chromium
description: Install the locked Playwright headless shell and verify that it launches
inputs:
  working-directory:
    description: Project with Playwright already installed
    default: .
runs:
  using: composite
  steps:
    - name: Read Playwright version
      if: runner.os == 'Windows'
      id: playwright
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Restore the Windows Chromium download
      if: runner.os == 'Windows'
      uses: actions/cache@v5
      with:
        path: ~/AppData/Local/ms-playwright
        key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium headless shell
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no playwright install chromium --only-shell --no-progress
    - name: Verify Chromium can launch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        probe() {
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({ timeout: 15_000 }); await browser.close();'
        }
        log=$(mktemp)
        if probe > "$log" 2>&1; then
          exit 0
        fi
        cat "$log"
        if [[ "$RUNNER_OS" == Linux ]] && rg -q 'Host system is missing dependencies|error while loading shared libraries' "$log"; then
          npx --no playwright install-deps chromium
          probe
        else
          exit 1
        fi
