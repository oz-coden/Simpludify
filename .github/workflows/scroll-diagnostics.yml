name: Scroll measured-budget verification
on:
  push:
    branches: [feat/canvas-scroll-input-2026-10-30]
    paths:
      [
        .github/workflows/scroll-diagnostics.yml,
        tests/browser/portable-ui.spec.ts,
      ]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, narrow]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser -- --project=${{ matrix.project }} --grep 'Web plays a JSON Prism|Host frames advance momentum|portable UI|slides against Solid walls' --repeat-each=3
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/repeated-scroll.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: repeated-scroll-${{ matrix.project }}
          path: test-results/
