name: Scroll teardown diagnostics
on:
  push:
    branches: [feat/canvas-scroll-input-2026-10-30]
    paths: [.github/workflows/scroll-diagnostics.yml, tests/browser/teardown-probe.ts]
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [main, work]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Preserve diagnostic overlay and select baseline
        if: matrix.revision == 'main'
        run: |
          cp tests/browser/replay.spec.ts /tmp/replay.spec.ts
          cp tests/browser/teardown-probe.ts /tmp/teardown-probe.ts
          git fetch origin main
          git checkout --detach origin/main
          cp /tmp/replay.spec.ts tests/browser/replay.spec.ts
          cp /tmp/teardown-probe.ts tests/browser/teardown-probe.ts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Repeat exact affected tests
        run: npm run test:browser -- --project=desktop --grep '${{ matrix.revision == 'main' && 'Web plays a JSON Prism' || 'Web plays a JSON Prism|Host frames advance momentum' }}' --repeat-each=3
        env:
          TRACE_TEARDOWN: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/teardown.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: teardown-${{ matrix.revision }}
          path: test-results/
