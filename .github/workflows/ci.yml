name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"
# Preserve the newest checkpoint; obsolete runs otherwise occupy runners for minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.run_attempt > 1 && format('-retry-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: mkdir -p test-results
      - run: npm run bench
      - run: npm run bench:practical -- --out test-results/practical-core.json
      - run: npm run bench:response -- --out test-results/response-core.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: core-validation
          path: test-results/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Shards have separate runners/browsers and one foreground worker each.
      matrix:
        project: [desktop, narrow]
        shard: [1, 2]
        include:
          - project: desktop
            shard: 3
          - project: desktop
            shard: 4
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-chromium
      - run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.project == 'desktop' && 4 || 2 }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: browser-validation-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-chromium
      - run: npm run test:build
      - run: npm run test:build:game
      - run: npm run build -- --target web --example canvas-ui --base /Simpludify/
      - run: node scripts/smoke-build.mjs --example canvas-ui
      - run: npm run build -- --target web --example tween --base /Simpludify/
      - run: node scripts/smoke-build.mjs --example tween
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: production-validation
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
  site-bases:
    outputs:
      pages-artifact: ${{ steps.stamp.outputs.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: /Simpludify/
            artifact: project
          - base: /
            artifact: root
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-chromium
      - run: npm run site:build -- --base "${{ matrix.base }}"
      - run: npm run site:check
      - run: npm run test:site
      - run: node scripts/site-sdk-integration-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-tile-geometry-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-tilemap-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-virtual-input-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-unified-input-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: site-validation-${{ matrix.artifact }}
          path: test-results/site/
          if-no-files-found: ignore
      - name: Stamp deployable site with the source revision
        id: stamp
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.artifact == 'project'
        run: |
          printf '%s\n' "$GITHUB_SHA" > site-dist/ci-source.txt
          echo "artifact=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.artifact == 'project'
        with:
          name: ${{ steps.stamp.outputs.artifact }}
          path: site-dist
  sdk-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:packages
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-candidate
          path: |
            test-results/packages/*.tgz
            test-results/packages/*-pack.json
          if-no-files-found: error
          overwrite: true
  packages:
    needs: sdk-candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/npm-vite/package-lock.json
      - run: npm ci
      - name: Check tooling paths and package compilation on Windows
        if: runner.os == 'Windows'
        run: |
          npx --no vitest run tests/unit/path-boundary.test.ts tests/unit/core-boundary.test.ts tests/unit/cli.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:packages
      - uses: actions/download-artifact@v7.0.0
        with:
          name: sdk-candidate
          path: test-results/packages
      - uses: ./.github/actions/setup-chromium
      - name: Validate installed package contents and public APIs
        id: packages
        run: npm run test:packages -- --packed
      - name: Validate the candidate in the starter
        if: ${{ !cancelled() && steps.packages.outcome != 'skipped' }}
        run: npm run test:starter -- --packed
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: npm-sdk-validation-${{ matrix.os }}
          path: |
            test-results/packages/*.json
            test-results/packages/*.png
          if-no-files-found: ignore
          overwrite: true
  sdk-consumer-build:
    needs: sdk-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # Pin application source and its toolchain. The isolated lock replaces both SDK entries.
      - uses: actions/checkout@v7.0.1
        with:
          repository: oz-coden/Run-To-Exit
          ref: 62425811993eb215129c98db33b9c8ae7cdd5be5
          path: test-results/consumer-source
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test-results/consumer-source/package-lock.json
      - uses: actions/download-artifact@v7.0.0
        with:
          name: sdk-candidate
          path: test-results/packages
      - name: Install candidate, typecheck, run units and build the external game
        run: npm run test:consumer:prepare -- test-results/consumer-source "$RUNNER_TEMP/run-to-exit"
      - name: Verify consumer dependency files are unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- package.json package-lock.json
        working-directory: test-results/consumer-source
      - name: Archive portable consumer fixture
        run: |
          cp test-results/consumer-source/package-lock.json "$RUNNER_TEMP/run-to-exit/tooling-lock.json"
          tar -czf test-results/run-to-exit.tar.gz --exclude=node_modules -C "$RUNNER_TEMP" run-to-exit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-consumer-build
          path: test-results/run-to-exit.tar.gz
          if-no-files-found: error
          overwrite: true
  sdk-consumer:
    needs: sdk-consumer-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, compact, narrow, canvas2d]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          name: sdk-consumer-build
          path: test-results
      - name: Extract the fixture and stage its toolchain cache key
        run: |
          tar -xzf test-results/run-to-exit.tar.gz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/run-to-exit/tooling-lock.json" test-results/run-to-exit-tooling-lock.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test-results/run-to-exit-tooling-lock.json
      - run: npm ci
        working-directory: ${{ runner.temp }}/run-to-exit
      - uses: ./.github/actions/setup-chromium
        with:
          working-directory: ${{ runner.temp }}/run-to-exit
      - name: Test the same production build in each renderer and viewport
        working-directory: ${{ runner.temp }}/run-to-exit
        env:
          PROJECT: ${{ matrix.project }}
          E2E_REQUIRE_LABELS: "1"
        run: |
          export E2E_SDK_VERSION="$(cat candidate-version.txt)"
          projects=(--project="$PROJECT")
          if [[ "$PROJECT" == canvas2d ]]; then
            projects=(--project=desktop-canvas2d --project=compact-canvas2d --project=narrow-canvas2d)
          fi
          npm run test:e2e -- --retries=0 --max-failures=0 "${projects[@]}"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sdk-consumer-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/run-to-exit/candidate-version.txt
            ${{ runner.temp }}/run-to-exit/test-results/
            ${{ runner.temp }}/run-to-exit/playwright-report/
          if-no-files-found: ignore
          overwrite: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, browser, production, site-bases, packages, sdk-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify this push is still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
      # Pages must already be enabled by an administrator.
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.site-bases.outputs.pages-artifact }}
  published-site:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://github.oz-coden.com/Simpludify/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-chromium
      - name: Wait for the deployed revision
        run: |
          for attempt in {1..12}; do
            if [[ "$(curl -fsS --max-time 10 "${SITE_URL}ci-source.txt?run=${GITHUB_RUN_ID}&attempt=${attempt}")" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages is not serving $GITHUB_SHA"
          exit 1
      - run: node scripts/site-sdk-integration-live.mjs
      - run: node scripts/site-tween-live.mjs
      - run: node scripts/site-tilemap-live.mjs
      - run: node scripts/site-tile-geometry-live.mjs
      - run: node scripts/site-virtual-input-live.mjs
      - run: node scripts/site-unified-input-live.mjs
      - name: Confirm the revision did not change during E2E
        run: test "$(curl -fsS --max-time 10 "${SITE_URL}ci-source.txt?run=${GITHUB_RUN_ID}&check=final")" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: published-sample-validation
          path: |
            test-results/site/unified-input-live.json
            test-results/site/virtual-input-live.json
            test-results/site/sdk-integration-live.json
            test-results/site/tween-live.json
            test-results/site/tilemap-live.json
            test-results/site/tile-geometry-live.json
          if-no-files-found: ignore
