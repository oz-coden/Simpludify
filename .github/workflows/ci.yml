name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Preserve the newest checkpoint; obsolete runs otherwise occupy runners for minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: mkdir -p test-results
      - run: npm run bench
      - run: npm run bench:practical -- --out test-results/practical-core.json
      - run: npm run bench:response -- --out test-results/response-core.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: core-validation
          path: test-results/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Shards have separate runners/browsers and one foreground worker each.
      matrix:
        project: [desktop, narrow]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-validation-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:build
      - run: npm run test:build:game
      - run: npm run build -- --target web --example canvas-ui --base /Simpludify/
      - run: node scripts/smoke-build.mjs --example canvas-ui
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: production-validation
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
  site-bases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: /Simpludify/
            artifact: project
          - base: /
            artifact: root
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run site:build -- --base "${{ matrix.base }}"
      - run: npm run site:check
      - run: npm run test:site
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: site-validation-${{ matrix.artifact }}
          path: test-results/site/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.artifact == 'project'
        with:
          path: site-dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, browser, production, site-bases]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled by an administrator.
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/deploy-pages@v4
        id: deployment
