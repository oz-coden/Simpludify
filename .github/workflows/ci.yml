name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Preserve the newest checkpoint; obsolete runs otherwise occupy runners for minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: mkdir -p test-results
      - run: npm run bench
      - run: npm run bench:practical -- --out test-results/practical-core.json
      - run: npm run bench:response -- --out test-results/response-core.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: core-validation
          path: test-results/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Shards have separate runners/browsers and one foreground worker each.
      matrix:
        project: [desktop, narrow]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-validation-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:build
      - run: npm run test:build:game
      - run: npm run build -- --target web --example canvas-ui --base /Simpludify/
      - run: node scripts/smoke-build.mjs --example canvas-ui
      - run: npm run build -- --target web --example tween --base /Simpludify/
      - run: node scripts/smoke-build.mjs --example tween
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: production-validation
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
  site-bases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: /Simpludify/
            artifact: project
          - base: /
            artifact: root
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run site:build -- --base "${{ matrix.base }}"
      - run: npm run site:check
      - run: npm run test:site
      - run: node scripts/site-sdk-integration-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-tile-geometry-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-tilemap-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-virtual-input-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - run: node scripts/site-unified-input-live.mjs
        env:
          SITE_BASE: ${{ matrix.base }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: site-validation-${{ matrix.artifact }}
          path: test-results/site/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.artifact == 'project'
        with:
          path: site-dist
  packages:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:packages
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-sdk-validation-${{ matrix.os }}
          path: test-results/packages/
          if-no-files-found: ignore
  sdk-starter:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:starter
  tooling-paths:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/path-boundary.test.ts tests/unit/core-boundary.test.ts tests/unit/cli.test.ts
  sdk-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            desktop,
            compact,
            narrow,
            desktop-canvas2d,
            compact-canvas2d,
            narrow-canvas2d,
          ]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run pack:packages
      - name: Resolve candidate version
        id: sdk
        run: |
          version=$(node --input-type=module -e 'import {sdkVersion} from "./scripts/sdk-version.mjs"; console.log(sdkVersion)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Frozen external consumer; its committed registry dependencies stay at 0.1.3.
      - uses: actions/checkout@v7.0.1
        with:
          repository: oz-coden/Run-To-Exit
          ref: e3c6f50ad837e2d2c598a1a1d01c47077b33d00c
          path: test-results/consumer-source
      - run: mkdir -p "${{ runner.temp }}/candidate"
      - run: npm run test:sdk-candidate -- "${{ github.workspace }}/test-results/packages/simpludify-core-${{ steps.sdk.outputs.version }}.tgz" "${{ github.workspace }}/test-results/packages/simpludify-web-${{ steps.sdk.outputs.version }}.tgz" --project=${{ matrix.project }}
        working-directory: test-results/consumer-source
        env:
          TMPDIR: ${{ runner.temp }}/candidate
      - name: Verify consumer dependency files are unchanged
        if: always()
        run: git diff --exit-code -- package.json package-lock.json
        working-directory: test-results/consumer-source
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: sdk-consumer-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/candidate/run-to-exit-sdk-*/candidate-result.json
            ${{ runner.temp }}/candidate/run-to-exit-sdk-*/test-results/
            ${{ runner.temp }}/candidate/run-to-exit-sdk-*/playwright-report/
            test-results/packages/*-pack.json
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      [
        quality,
        browser,
        production,
        site-bases,
        packages,
        sdk-starter,
        tooling-paths,
        sdk-consumer,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled by an administrator.
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/site-sdk-integration-live.mjs
        env:
          SITE_URL: https://github.oz-coden.com/Simpludify/
      - run: node scripts/site-tween-live.mjs
        env:
          SITE_URL: https://github.oz-coden.com/Simpludify/
      - run: node scripts/site-tilemap-live.mjs
        env:
          SITE_URL: https://github.oz-coden.com/Simpludify/
      - run: node scripts/site-tile-geometry-live.mjs
        env:
          SITE_URL: https://github.oz-coden.com/Simpludify/
      - run: node scripts/site-virtual-input-live.mjs
        env:
          SITE_URL: https://github.oz-coden.com/Simpludify/
      - run: node scripts/site-unified-input-live.mjs
        env:
          SITE_URL: https://github.oz-coden.com/Simpludify/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: published-sample-validation
          path: |
            test-results/site/unified-input-live.json
            test-results/site/virtual-input-live.json
            test-results/site/sdk-integration-live.json
            test-results/site/tween-live.json
            test-results/site/tilemap-live.json
            test-results/site/tile-geometry-live.json
          if-no-files-found: ignore
