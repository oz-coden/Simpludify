name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - run: npm run test:build
      - run: npm run test:build:game
      - run: npm run bench
      - run: npm run bench:practical -- --out test-results/practical-core.json
      - run: npm run bench:response -- --out test-results/response-core.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: web-validation
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
  site-bases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: /Simpludify/
            artifact: project
          - base: /
            artifact: root
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run site:build -- --base "${{ matrix.base }}"
      - run: npm run site:check
      - run: npm run test:site
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: site-validation-${{ matrix.artifact }}
          path: test-results/site/
          if-no-files-found: ignore
