name: Publish experimental npm SDK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated main tag matching the SDK version
        required: true
      confirmation:
        description: "Type: publish @simpludify/core@VERSION and @simpludify/web@VERSION"
        required: true
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate approval, tag and source revision
        id: revision
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node --input-type=module -e 'import {sdkVersion} from "./scripts/sdk-version.mjs"; console.log(sdkVersion)')
          test "$RELEASE_TAG" = "v$version"
          test "$CONFIRMATION" = "publish @simpludify/core@$version and @simpludify/web@$version"
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          test "$sha" = "$GITHUB_SHA"
          SHA="$sha" node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const runs = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${process.env.SHA}&event=push&per_page=100`], {encoding:'utf8'})).workflow_runs;
          if (!runs.some(run => run.head_branch === 'main' && run.status === 'completed' && run.conclusion === 'success')) throw new Error('Tag must have a successful main push CI run');
          JS
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.revision.outputs.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: ./.github/actions/setup-chromium
      - run: npm run test:packages
      - name: Record exact archives
        run: |
          cd test-results/packages
          sha256sum *.tgz > SHA256SUMS
      - run: node scripts/publish-packages.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          overwrite: true
          name: npm-sdk-validation
          path: test-results/packages/
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check OIDC-compatible tooling
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const version = execFileSync('npm', ['--version'], {encoding:'utf8'}).trim().split('.').map(Number);
          if (version[0] < 11 || version[0] === 11 && (version[1] < 5 || version[1] === 5 && version[2] < 1)) throw new Error('npm >=11.5.1 required');
          console.log(process.version, version.join('.'));
          JS
      - uses: actions/download-artifact@v7.0.0
        with:
          overwrite: true
          name: npm-sdk-validation
          path: test-results/packages
      - name: Publish exact validated archives, Core first
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd test-results/packages
          sha256sum --check SHA256SUMS
          cd ../..
          node scripts/publish-packages.mjs --publish
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          overwrite: true
          name: npm-sdk-publication
          path: test-results/packages/
  registry-acceptance:
    needs: [validate, publish]
    uses: ./.github/workflows/npm-registry-acceptance.yml
    with:
      source: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}
