name: Practical validation
on:
  push:
    branches: [codex/practical-core-checkpoint]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Export canonical source formatting
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          for (const path of execFileSync("git", ["diff", "--name-only", "-z"], {encoding:"utf8"}).split("\0").filter(Boolean))
            console.log("FORMATTED_FILE "+JSON.stringify({path,content:readFileSync(path,"utf8")}));
          JS
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - run: npm run test:build
      - run: npm run test:build:game
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: practical-validation
          path: |
            test-results/
            dist/
          if-no-files-found: ignore
